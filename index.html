<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>가온빛교회 바이블맵 (성경읽기필사지도)</title>

<!-- 카톡/문자 등 링크 미리보기용 (Open Graph) -->
<meta property="og:title" content="가온빛교회 바이블맵 (성경읽기필사지도)">
<meta property="og:description" content="성경 읽기·필사 진도를 기록하고, 관련 설교와 함께 말씀을 더 깊이 묵상해보세요.">
<meta property="og:image" content="https://yun0308.github.io/gaonvit-biblemap/assets/logo.png">
<meta property="og:url" content="https://yun0308.github.io/gaonvit-biblemap/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">

<!-- 홈 화면 바로가기 아이콘 (iOS/Android/일반 브라우저 공통) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#1B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="바이블맵">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF7F0;
  --cream-2:#FFFFFF;
  --navy:#1B2A4A;
  --navy-soft:#5B6A87;
  --gold:#C9A961;
  --line:#E7E0CE;

  --read:#C9A961;         /* 읽기완료 — 골드 */
  --read-bg:#F6ECD4;
  --write:#1B2A4A;        /* 필사완료 — 네이비 */
  --write-bg:#E4E8EF;
  --both:#8A6A1E;         /* 둘다완료 — 짙은 골드(브론즈) */
  --both-bg:#1B2A4A;

  --r:10px;
  --shadow:0 1px 2px rgba(27,42,74,.06), 0 6px 20px rgba(27,42,74,.06);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--cream);
  color:var(--navy);
  line-height:1.6;
  font-size:17px;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:contain;
}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2.5px solid var(--navy);outline-offset:2px}

.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* ===== 로그인 ===== */
#login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(36px + env(safe-area-inset-top)) 18px calc(52px + env(safe-area-inset-bottom));background:var(--cream)}
.login-card{max-width:440px;width:100%;margin:0 auto}

.brand{text-align:center;margin-bottom:40px}
.brand-mark{
  width:76px;height:76px;margin:0 auto 20px;
  border:1.5px solid var(--gold);border-radius:50%;
  display:grid;place-items:center;background:#fff;
  overflow:hidden;
}

.brand h1{
  font-family:'Gowun Batang',serif;
  font-size:29px;font-weight:700;letter-spacing:-.02em;line-height:1.3;
  color:var(--navy);
}
.brand h1 .en{
  display:block;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;
  letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-top:6px;
}
.brand .sub-title{margin-top:12px;color:var(--navy);font-size:15.5px;font-weight:600}
.brand p{margin-top:9px;color:var(--navy-soft);font-size:15px;letter-spacing:.01em}

.field{margin-bottom:22px}
.field label{display:block;font-size:15px;font-weight:700;margin-bottom:9px;color:var(--navy)}
.field .opt{font-weight:400;color:var(--navy-soft);font-size:13.5px;margin-left:5px}
.field input{
  width:100%;padding:15px 16px;
  border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--cream-2);font-size:17px;
  transition:border-color .15s;
}
.field input:focus{border-color:var(--navy);outline:none}
.field input.err{border-color:#A8442F;background:#FBF0ED}
.hint{font-size:13.5px;color:var(--navy-soft);margin-top:8px}
.hint.err{color:#A8442F;font-weight:600}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.seg button{
  padding:15px 10px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--cream-2);font-weight:600;font-size:16px;transition:all .15s;
}
.seg button[aria-pressed="true"]{
  border-color:var(--navy);background:var(--navy);color:var(--cream);
}

.btn-primary{
  width:100%;padding:17px;margin-top:10px;
  background:var(--navy);color:var(--cream);
  border-radius:var(--r);font-size:18px;font-weight:700;letter-spacing:-.01em;
  transition:opacity .15s;
}
.btn-primary:active{opacity:.85}

.guest-note{
  margin-top:20px;padding:14px 16px;
  background:var(--cream-2);border:1px solid var(--line);border-radius:var(--r);
  font-size:13.5px;color:var(--navy-soft);line-height:1.65;
}
.help-link{
  display:block;text-align:center;margin-top:18px;
  font-size:14px;color:var(--navy-soft);text-decoration:none;font-weight:600;
}
.help-link:active{color:var(--navy)}

/* ===== 지도 헤더 ===== */
#map{display:none}
.map-header{
  background:var(--navy);color:var(--cream);
  padding:calc(16px + env(safe-area-inset-top)) 16px 44px;text-align:center;position:relative;
}
.header-toolbar{
  display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:20px;
}
.header-actions{
  display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:nowrap;
}
.header-actions .sep{color:rgba(232,217,181,.35);font-size:12px;flex:none}
.map-header .logout, .map-header .action-btn{
  padding:10px 6px;border:none;background:transparent;
  font-size:13px;font-weight:600;color:var(--gold-soft,#E8D9B5);
  text-decoration:none;display:inline-block;opacity:.9;white-space:nowrap;
}
.map-header .logout:active, .map-header .action-btn:active{opacity:.6}
.sync-status{
  position:fixed;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;color:#CBD3E3;
  background:rgba(27,42,74,.92);padding:7px 12px;border-radius:20px;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
  backdrop-filter:blur(4px);
}
.sync-status .dot{width:6px;height:6px;border-radius:50%;background:#9AA6BE;flex:none}
.sync-status[data-st="syncing"]{color:var(--gold-soft,#E8D9B5)}
.sync-status[data-st="syncing"] .dot{background:var(--gold-soft,#E8D9B5);animation:pulse 1s infinite}
.sync-status[data-st="saved"]{color:#9FD8B8}
.sync-status[data-st="saved"] .dot{background:#9FD8B8}
.sync-status[data-st="error"]{color:#E8A48C}
.sync-status[data-st="error"] .dot{background:#E8A48C}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.map-header .eyebrow{
  letter-spacing:.15em;font-size:11.5px;color:#E8D9B5;
  text-transform:uppercase;margin-bottom:.6rem;font-weight:600;
}
.map-header h1{
  font-size:23px;font-weight:700;margin-bottom:.5rem;letter-spacing:-.01em;
}
.map-header p{font-size:13px;color:#B9C2D6}

.banner{
  background:var(--read-bg);border-bottom:1px solid #E3D19F;
  padding:11px 18px;font-size:13.5px;text-align:center;color:#7A5D10;font-weight:500;
}

/* ===== 통계: 헤더 아래로 이어붙는 스트립 ===== */
.stats{
  max-width:720px;margin:-34px auto 2rem;
  display:flex;gap:1px;background:#DFDAC6;border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(27,42,74,.12);
  position:relative;z-index:5;
}
.stat{flex:1;background:#FFFFFF;padding:18px 4px 15px;text-align:center}
.stat .v{font-size:30px;font-weight:800;line-height:1.15;color:#1F2B46}
.stat .v small{font-size:17px;font-weight:700;margin-left:1px}
.stat .k{font-size:13px;color:#8D8B83;font-weight:500;margin-top:7px}

.legend{
  display:flex;flex-wrap:wrap;gap:14px;
  padding:13px 15px;margin:18px 0 20px;
  background:var(--cream-2);border:1px solid var(--line);border-radius:var(--r);
  font-size:13px;color:#8D8B83;
}
.legend i{
  width:14px;height:14px;border-radius:4px;display:inline-block;
  vertical-align:-2px;margin-right:6px;
}
.legend i.lg-dot{position:relative;background:#F5F1E6}
.legend i.lg-dot::after{
  content:"";position:absolute;top:2px;right:2px;
  width:4px;height:4px;border-radius:50%;background:var(--navy-soft);
}

/* ===== 책 그룹 ===== */
.group-title{
  font-size:13px;font-weight:700;color:var(--gold-deep,#9A7B2E);
  letter-spacing:.08em;margin:26px 0 10px;text-transform:uppercase;
}
.group-title:first-child{margin-top:0}

/* ===== 권 카드 ===== */
.book{
  background:var(--cream-2);border-radius:10px;
  padding:14px 15px 15px;margin-bottom:10px;
  border:1px solid var(--line);
}
.book-head{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:10px;
}
.name-group{display:flex;align-items:center;gap:9px}
.book-head .name{font-size:16px;font-weight:700;color:var(--navy)}

.bulk{
  display:inline-flex;align-items:center;flex:none;
  margin-left:2px;
}
.bulk .box{
  width:18px;height:18px;border:1.6px solid #C7BFA6;border-radius:4px;
  display:grid;place-items:center;flex:none;background:#fff;
}
.bulk[aria-pressed="true"] .box{background:var(--navy);border-color:var(--navy)}
.bulk[aria-pressed="true"] .box::after{
  content:"";width:8px;height:5px;margin-top:-1px;
  border-left:1.8px solid var(--cream);border-bottom:1.8px solid var(--cream);
  transform:rotate(-45deg);
}

.collapse-btn{
  display:flex;align-items:center;justify-content:center;flex:none;
  padding:8px;color:var(--navy-soft);background:transparent;border:none;
}
.collapse-btn svg{transition:transform .2s}
.book.collapsed .collapse-btn svg{transform:rotate(-90deg)}
.book.collapsed .grid,
.book.collapsed .sermons{display:none}

.grid{display:flex;flex-wrap:wrap;gap:5px}
.ch{
  position:relative;width:26px;height:26px;
  border-radius:5px;border:1px solid #E4DECF;
  background:#F5F1E6;color:#B7AF9C;
  font-size:11px;font-weight:500;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s,transform .1s;
}
.ch:active{transform:scale(.9)}
/* 현재 활동(로그인 시 선택한 모드)은 채우기, 다른 활동은 테두리만 */
body.mode-read .ch[data-s="primary"]{background:var(--navy);border-color:var(--navy);color:var(--cream);font-weight:700}
body.mode-read .ch[data-s="secondary"]{background:#F5F1E6;border:1.4px solid #DCC694;color:#9A8354;font-weight:600}
body.mode-read .ch[data-s="both"]{background:var(--navy);border:2px solid var(--gold);color:var(--cream);font-weight:700}

body.mode-write .ch[data-s="primary"]{background:var(--gold);border-color:var(--gold);color:#4A3B14;font-weight:700}
body.mode-write .ch[data-s="secondary"]{background:#F5F1E6;border:1.4px solid #A9B4C6;color:var(--navy-soft);font-weight:600}
body.mode-write .ch[data-s="both"]{background:var(--gold);border:2px solid var(--navy);color:#4A3B14;font-weight:700}

.ch.has-sermon::after{
  content:"";position:absolute;top:-2px;right:-2px;
  width:5px;height:5px;border-radius:50%;background:var(--navy);
}
.ch[data-s]:not([data-s=""]).has-sermon::after{background:var(--cream);border:1px solid var(--navy)}

.book-bar{height:4px;background:#EDE7D8;border-radius:2px;margin-top:11px;overflow:hidden;display:flex}
.book-bar i{display:block;height:100%}
.book-bar .b-read{background:var(--navy)}
.book-bar .b-write{background:var(--gold)}

.sermons{margin-top:11px;padding-top:10px;border-top:1px solid #EFE7D2;display:flex;flex-direction:column;gap:6px}
.sermon{
  display:flex;align-items:baseline;gap:7px;font-size:12.5px;
  color:var(--navy);text-decoration:none;line-height:1.45;
}
.badge{
  flex:none;background:var(--navy);color:#E8D9B5;
  font-size:10.5px;padding:2px 6px;border-radius:4px;font-weight:700;
}
.sermon-t{flex:1;min-width:0;color:var(--ink,#2C2C2A);word-break:keep-all;overflow-wrap:break-word}
.sermon:active .sermon-t{text-decoration:underline}
.sermon-p{
  flex:0 0 auto;max-width:88px;color:var(--navy-soft);font-size:11.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ===== 하단 ===== */
.foot{padding:30px 0 44px;text-align:center}

#loading{padding:60px 20px;text-align:center;color:var(--navy-soft)}
#loading .spin{
  width:30px;height:30px;margin:0 auto 14px;
  border:3px solid var(--line);border-top-color:var(--navy);
  border-radius:50%;animation:spin .8s linear infinite;
}
#loading p{font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-reset{
  padding:12px 22px;border:1.5px solid var(--line);border-radius:9px;
  background:var(--cream-2);font-size:14.5px;color:var(--navy-soft);font-weight:600;
}
.foot p{margin-top:15px;font-size:12.5px;color:var(--navy-soft)}

/* ===== 토스트 ===== */
#toast{
  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,90px);
  background:var(--navy);color:var(--cream);
  padding:13px 22px;border-radius:22px;font-size:14.5px;font-weight:600;
  z-index:100;transition:transform .28s cubic-bezier(.2,.9,.3,1.2);
  max-width:calc(100% - 32px);text-align:center;
  box-shadow:0 6px 24px rgba(27,42,74,.28);
}
#toast.on{transform:translate(-50%,0)}

@media (min-width:600px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
  .brand h1{font-size:32px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<!-- ========== 로그인 ========== -->
<section id="login">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <img src="assets/logo.png" alt="바이블 맵 로고" style="width:100%;height:100%;object-fit:contain;border-radius:50%">
      </div>
      <h1>바이블 맵 <span class="en">Bible Map</span></h1>
      <p class="sub-title">성경 읽기·필사 지도</p>
      <p>대한예수교장로회(고신) 가온빛교회</p>
    </div>

    <div class="field">
      <label for="f-name">이름 <span class="opt">비워두면 둘러보기로 시작합니다</span></label>
      <input id="f-name" type="text" autocomplete="name" placeholder="이름을 입력하세요">
    </div>

    <div class="field">
      <label for="f-birth">생일 <span class="opt">이름을 적었다면 필수, 월일 4자리</span></label>
      <input id="f-birth" type="tel" inputmode="numeric" maxlength="4" autocomplete="bday"
             placeholder="0101">
      <p class="hint" id="birth-hint">숫자 4자리로 입력해주세요 (예: 1월 1일 → 0101)</p>
    </div>

    <div class="field">
      <label>먼저 기록할 활동</label>
      <div class="seg" id="seg-mode">
        <button type="button" data-v="read" aria-pressed="true">읽기</button>
        <button type="button" data-v="write" aria-pressed="false">필사</button>
      </div>
    </div>

    <div class="field">
      <label>성경</label>
      <div class="seg" id="seg-test">
        <button type="button" data-v="OT" aria-pressed="false">구약</button>
        <button type="button" data-v="NT" aria-pressed="true">신약</button>
      </div>
    </div>

    <button class="btn-primary" id="btn-start">시작</button>

    <p class="guest-note">
      이름 없이 시작하면 지도를 둘러볼 수 있지만, 표시한 진도는 저장되지 않습니다.
    </p>

    <a class="help-link" href="guide.html" target="_blank" rel="noopener">도움말 보기</a>
  </div>
</section>

<!-- ========== 지도 ========== -->
<section id="map">
  <span class="sync-status" id="sync-status" data-st="idle" style="display:none">
    <i class="dot"></i><span id="sync-status-text">저장됨</span>
  </span>
  <header class="map-header">
    <div class="header-toolbar">
      <div class="header-actions">
        <button class="action-btn" id="btn-switch-testament">구약 바로가기</button>
        <span class="sep">·</span>
        <a class="action-btn" id="btn-help" href="guide.html" target="_blank" rel="noopener">도움말</a>
        <span class="sep">·</span>
        <button class="logout" id="btn-logout">처음화면으로</button>
      </div>
    </div>

    <div class="eyebrow" id="who-eyebrow">가온빛교회</div>
    <h1 id="who-name">—</h1>
    <p id="who-meta">—</p>
  </header>

  <div class="banner" id="guest-banner" style="display:none">
    둘러보기 중입니다. 표시한 진도는 저장되지 않습니다.
  </div>

  <div class="stats">
    <div class="stat">
      <div class="v" id="s-pct">0<small>%</small></div>
      <div class="k">전체 진도</div>
    </div>
    <div class="stat">
      <div class="v" id="s-done">0</div>
      <div class="k">완료한 장</div>
    </div>
    <div class="stat">
      <div class="v" id="s-total">0</div>
      <div class="k">전체 장</div>
    </div>
    <div class="stat">
      <div class="v" id="s-sermon">0</div>
      <div class="k">연결된 설교</div>
    </div>
  </div>

  <div class="wrap">
    <div class="legend" id="legend"></div>

    <div id="books"></div>
    <div id="loading" style="display:none">
      <div class="spin"></div>
      <p>불러오는 중…</p>
    </div>

    <div class="foot">
      <button class="btn-reset" id="btn-reset">진도 초기화</button>
      <p id="sync-note">기기가 달라도 이름과 생일이 같으면 이어서 기록됩니다.</p>
    </div>
  </div>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   설정
   ============================================================ */
const CONFIG = {
  // Apps Script 웹앱 URL을 배포한 뒤 여기에 붙여넣으세요.
  // 비워두면 이 브라우저에만 저장하는 '로컬 모드'로 동작합니다.
  API_URL: 'https://script.google.com/macros/s/AKfycbzHjZ10cYdtHiHeVCf5qy65cKwHT7AmRb9ZeghiTrW-2KQ7xlcjdpkMJ0RkdN9Znkgc/exec',

  // 설교 데이터 파일 경로 (같은 폴더에 sermons.json 을 두세요)
  SERMONS_URL: './sermons.json'
};

/* ============================================================
   성경 메타데이터 (개역개정 · 구약 39권 929장 / 신약 27권 260장)

function localKey(){
  return 'gaonbit_progress_' + S.name + '_' + S.birth + '_' + S.testament;
}

/* 서버에서 받은 최신 진도로 교체하되, 아직 서버에 전송 안 된(디바운스 대기중인) 로컬 클릭은
   덮어쓰지 않고 그 위에 다시 얹어서 보존한다. (캐시를 먼저 보여주는 동안 사용자가 클릭했는데,
   그 직후 서버 응답이 도착해서 그 클릭이 조용히 사라지는 걸 방지하기 위함) */
function mergeServerProgress(serverProgress){
  const merged = serverProgress || {};
  for(const key in S.pending){
    const [bookId, ch] = key.split(':');
    const localVal = (S.progress[bookId]||{})[ch];
    if(!localVal) continue;
    if(!merged[bookId]) merged[bookId] = {};
    merged[bookId][ch] = localVal; // 서버 값 대신 아직 안 보낸 로컬 클릭 값을 유지
  }
  return merged;
}

async function loadProgress(){
  if(CONFIG.API_URL){
    try{
      const q = new URLSearchParams({
        action:'getProgress', name:S.name, birth_date:S.birth, testament:S.testament,
        _: Date.now()  // 통신사/브라우저의 GET 응답 캐싱을 우회하기 위한 매번 다른 값
      });
      const res = await fetch(CONFIG.API_URL + '?' + q, { cache: 'no-store' });
      const json = await res.json();
      if(json.ok){
        S.progress = mergeServerProgress(json.data.progress);
        saveLocal(); // 보기만 해도 캐시에 남겨서, 다음번 방문/전환이 느리지 않게 함
        return;
      }
      toast('진도를 불러오지 못했습니다: ' + json.error.message);
    }catch(e){
      toast('연결이 원활하지 않아 저장된 기록만 표시합니다.');
    }
  }
  try{ S.progress = JSON.parse(localStorage.getItem(localKey())||'{}'); }
  catch(e){ S.progress = {}; }
}

function saveLocal(){
  if(S.guest) return;
  try{ localStorage.setItem(localKey(), JSON.stringify(S.progress)); }catch(e){}
}

function setSyncStatus(state){
  if(S.guest || !CONFIG.API_URL) return;

/* 1~2초 모았다가 한 번에 전송 (Apps Script 동시 실행 제한 대응) */
function queue(bookId, chapter){
  if(S.guest || !CONFIG.API_URL) return;
  S.pending[bookId + ':' + chapter] = true;
  setSyncStatus(navigator.onLine===false ? 'offline' : 'syncing');
  clearTimeout(S.timer);
  S.timer = setTimeout(flush, 500);
}

async function flush(silent){
  clearTimeout(S.timer);
  const keys = Object.keys(S.pending);
  if(!keys.length || S.guest || !CONFIG.API_URL) return;
  S.pending = {};
  setSyncStatus('syncing');

  const updates = keys.map(k=>{
    const [bookId, ch] = k.split(':');
    const st = (S.progress[bookId]||{})[ch] || {read:false, write:false};
    return { book_id:bookId, chapter:Number(ch), read:st.read, write:st.write };
  });

  const ok = await post({
    action:'updateChapters',
    name:S.name, birth_date:S.birth, testament:S.testament,
    updates: updates
  });

  if(!ok){
    setSyncStatus('error');
    if(!silent) toast('저장하지 못했습니다. 잠시 후 다시 시도해주세요.');
    return;
  }
  setSyncStatus('saved');
}

/* 지수 백오프 재시도 */
async function post(body, tries){
  tries = tries || 0;
  try{
    const res = await fetch(CONFIG.API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},  // CORS preflight 회피
      body:JSON.stringify(body)
    });
    const json = await res.json();
    if(json.ok) return true;
    if(json.error && json.error.code==='RATE_LIMITED' && tries<3){
      await sleep(1000 * Math.pow(2,tries));
      return post(body, tries+1);
    }
    return false;
  }catch(e){
    if(tries<3){ await sleep(1000*Math.pow(2,tries)); return post(body,tries+1); }
    return false;
  }
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ============================================================
   상태 계산
   ============================================================ */
function stateOf(bookId, ch){
  const st = (S.progress[bookId]||{})[ch];
  if(!st) return '';
  if(st.read && st.write) return 'both';
  if(st.read) return 'read';
  if(st.write) return 'write';
  return '';
}

/* 화면 표시용: 로그인 시 고른 활동(모드)을 기준으로 채우기/테두리를 정한다.
   현재 모드 활동 = 채우기, 반대 활동 = 테두리만 */
function displayState(bookId, ch){
  const st = (S.progress[bookId]||{})[ch];
  if(!st) return '';
  const primaryOn = S.mode==='read' ? st.read : st.write;
  const secondaryOn = S.mode==='read' ? st.write : st.read;
  if(primaryOn && secondaryOn) return 'both';
  if(primaryOn) return 'primary';
  if(secondaryOn) return 'secondary';
  return '';
}

/* 현재 모드(읽기 또는 필사)의 활동만 독립적으로 켜짐/꺼짐 토글.
   반대쪽 활동(다른 모드에서 기록한 값)은 절대 건드리지 않는다. */
function cycle(bookId, ch){
  if(!S.progress[bookId]) S.progress[bookId] = {};
  const cur = S.progress[bookId][ch] || {read:false, write:false};
  const turnOn = !cur[S.mode];

  S.progress[bookId][ch] = {
    read:  S.mode==='read'  ? turnOn : cur.read,
    write: S.mode==='write' ? turnOn : cur.write
  };
}

function countBook(bookId, total){
  let r=0, w=0;
  const b = S.progress[bookId]||{};
  for(let i=1;i<=total;i++){
    const st=b[i]; if(!st) continue;
    if(st.read) r++;
    if(st.write) w++;
  }
  return {r,w};
}

function sermonsFor(bookId){
  return (S.sermons[S.testament]||{})[bookId] || [];
}
function chaptersWithSermon(bookId){
  const set = new Set();
  sermonsFor(bookId).forEach(s=>{
    for(let c=s.chapter_from; c<=s.chapter_to; c++) set.add(c);
  });
  return set;
}

/* ============================================================
   렌더
   ============================================================ */
function render(){
  renderStats();
  renderBooks();
}

function renderStats(){
  let count = 0;
  for(const bid in S.progress){
    for(const ch in S.progress[bid]){
      const st = S.progress[bid][ch];
      if(S.mode==='read' ? st.read : st.write) count++;
    }
  }
  const total = TOTAL[S.testament];
  $('#s-pct').innerHTML = Math.round(count/total*100) + '<small>%</small>';
  $('#s-done').textContent = count.toLocaleString();
  $('#s-total').textContent = total.toLocaleString();

  let sc=0;
  const list = S.sermons[S.testament]||{};
  for(const k in list) sc += list[k].length;
  $('#s-sermon').textContent = sc.toLocaleString();
}

function renderBooks(){
  const wrap = $('#books');
  const label = S.mode==='read' ? '읽기' : '필사';
  const bookMap = {};
  BOOKS[S.testament].forEach(b => bookMap[b[0]] = b);

  const html = [];

  GROUPS[S.testament].forEach(group=>{
    html.push(`<div class="group-title">${group.label}</div>`);

    group.ids.forEach(bid=>{
      const [, bname, total] = bookMap[bid];
      const {r,w} = countBook(bid, total);
      const dots = chaptersWithSermon(bid);
      const done = (S.mode==='read'?r:w) === total;
      const u = unitOf(bid);

      let cells = '';
      for(let c=1;c<=total;c++){
        const st = displayState(bid,c);
        cells += `<button class="ch${dots.has(c)?' has-sermon':''}" data-s="${st}"
          data-b="${bid}" data-c="${c}" data-t="${total}"
          aria-label="${bname} ${c}${u}">${c}</button>`;
      }

      const sm = sermonsFor(bid);
      let sermonHtml = '';
      if(sm.length){
        sermonHtml = `<div class="sermons">` +
          sm.map(s=>{
            const range = s.chapter_from===s.chapter_to
              ? `${s.chapter_from}${u}` : `${s.chapter_from}–${s.chapter_to}${u}`;
            return `<a class="sermon" href="${s.youtube_url}" target="_blank" rel="noopener">
              <span class="badge">${range}</span>
              <span class="sermon-t">${esc(s.title)}</span>
              <span class="sermon-p">${esc(s.preacher||'')}</span>
            </a>`;
          }).join('') + `</div>`;
      }

      html.push(`<article class="book${S.collapsed.has(bid)?' collapsed':''}">
        <div class="book-head">
          <div class="name-group">
            <span class="name">${bname}</span>
            <button class="bulk" data-b="${bid}" data-t="${total}" aria-pressed="${done}" aria-label="${bname} ${label} 전체 완료">
              <span class="box"></span>
            </button>
          </div>
          <button class="collapse-btn" data-b="${bid}" aria-expanded="${!S.collapsed.has(bid)}" aria-label="${bname} 접기/펼치기">
            <svg viewBox="0 0 20 20" width="18" height="18"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="grid">${cells}</div>
        ${sermonHtml}
        <div class="book-bar" aria-hidden="true">
          <i class="b-read" style="width:${(r/total*100)}%"></i>
          <i class="b-write" style="width:${(w/total*100)}%"></i>
        </div>
      </article>`);
    });
  });

  wrap.innerHTML = html.join('');
}

/* 시편만 '장'이 아니라 '편'을 씁니다 */
function unitOf(bookId){ return bookId==='psa' ? '편' : '장'; }

function esc(s){
  return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

/* ============================================================
   상호작용
   ============================================================ */
$('#books').addEventListener('click', async e=>{
  const collapseBtn = e.target.closest('.collapse-btn');
  if(collapseBtn){
    const bid = collapseBtn.dataset.b;
    const article = collapseBtn.closest('.book');
    const nowCollapsed = !article.classList.contains('collapsed');
    article.classList.toggle('collapsed', nowCollapsed);
    collapseBtn.setAttribute('aria-expanded', String(!nowCollapsed));
    if(nowCollapsed) S.collapsed.add(bid); else S.collapsed.delete(bid);
    return;
  }

  const cell = e.target.closest('.ch');
  if(cell){
    const bid = cell.dataset.b, ch = Number(cell.dataset.c), total = Number(cell.dataset.t);
    cycle(bid, ch);
    cell.dataset.s = displayState(bid, ch);
    saveLocal();
    updateBookMeta(bid, total);
    renderStats();
    queue(bid, ch);
    return;
  }

  const bulk = e.target.closest('.bulk');
  if(bulk){
    const bid = bulk.dataset.b, total = Number(bulk.dataset.t);
    const on = bulk.getAttribute('aria-pressed') !== 'true';

    if(!S.progress[bid]) S.progress[bid] = {};
    for(let c=1;c<=total;c++){
      const cur = S.progress[bid][c] || {read:false, write:false};
      S.progress[bid][c] = {
        read:  S.mode==='read'  ? on : cur.read,
        write: S.mode==='write' ? on : cur.write
      };
    }
    bulk.setAttribute('aria-pressed', String(on));
    saveLocal();

    // 해당 권 셀만 다시 칠하기
    const grid = bulk.closest('.book').querySelector('.grid');
    [...grid.children].forEach(c=>{ c.dataset.s = displayState(bid, Number(c.dataset.c)); });
    updateBookMeta(bid, total);
    renderStats();

    if(!S.guest && CONFIG.API_URL){
      const ok = await post({
        action:'updateBook',
        name:S.name, birth_date:S.birth, testament:S.testament,
        book_id:bid, mode:S.mode, value:on
      });
      toast(ok ? `${bulk.closest('.book').querySelector('.name').textContent} ${S.mode==='read'?'읽기':'필사'} ${on?'전체 완료':'전체 해제'}`
               : '저장하지 못했습니다. 잠시 후 다시 시도해주세요.');
    }
  }
});

function updateBookMeta(bid, total){
  const {r,w} = countBook(bid,total);
  const card = document.querySelector(`.bulk[data-b="${bid}"]`).closest('.book');
  card.querySelector('.b-read').style.width = (r/total*100) + '%';
  card.querySelector('.b-write').style.width = (w/total*100) + '%';
  const done = (S.mode==='read'?r:w) === total;
  card.querySelector('.bulk').setAttribute('aria-pressed', String(done));
}

/* 진도 초기화 */
$('#btn-reset').addEventListener('click', async ()=>{
  const t = S.testament==='OT' ? '구약' : '신약';
  const modeKor = S.mode==='read' ? '읽기' : '필사';
  if(!confirm(`${t} ${modeKor} 진도만 지웁니다.\n(${S.mode==='read'?'필사':'읽기'} 기록은 그대로 남습니다)\n되돌릴 수 없습니다.\n\n계속할까요?`)) return;

  // 현재 모드의 활동만 지우고, 반대쪽 활동은 그대로 둔다
  for(const bid in S.progress){
    for(const ch in S.progress[bid]){
      S.progress[bid][ch][S.mode] = false;
    }
  }
  saveLocal();
  render();

  if(CONFIG.API_URL){
    const ok = await post({
      action:'resetProgress',
      name:S.name, birth_date:S.birth,
      scope:'testament', testament:S.testament, mode:S.mode
    });
    toast(ok ? `${t} ${modeKor} 진도를 초기화했습니다.` : '초기화를 저장하지 못했습니다. 잠시 후 다시 시도해주세요.');
  }else{
    toast(`${t} ${modeKor} 진도를 초기화했습니다.`);
  }
});

/* 페이지를 떠나거나 백그라운드로 전환될 때 남은 변경분을 sendBeacon으로 확실히 전송
   (모바일에서는 fetch가 완료되기 전에 탭이 정지될 수 있어 beforeunload만으론 불충분) */
function beaconFlush(){
  const keys = Object.keys(S.pending);
  if(!keys.length || S.guest || !CONFIG.API_URL) return;
  S.pending = {};

  const updates = keys.map(k=>{
    const [bookId, ch] = k.split(':');
    const st = (S.progress[bookId]||{})[ch] || {read:false, write:false};
    return { book_id:bookId, chapter:Number(ch), read:st.read, write:st.write };
  });
  const body = JSON.stringify({
    action:'updateChapters',
    name:S.name, birth_date:S.birth, testament:S.testament,
    updates: updates
  });
  try{
    navigator.sendBeacon(CONFIG.API_URL, new Blob([body], {type:'text/plain;charset=utf-8'}));
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') beaconFlush();
});
window.addEventListener('pagehide', beaconFlush);
window.addEventListener('beforeunload', ()=>{ flush(true); });

/* 토스트 */
let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('on'), 2600);
}
</script>
